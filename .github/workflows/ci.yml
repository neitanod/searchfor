# The suite on four native systems (M5b spec §4.1 and §5): Linux x86-64, macOS arm64, macOS
# x86-64 and Windows x86-64 (MSVC), on every push to any branch and every pull request. Each
# job checks formatting (Linux), clippy, the release build and the whole suite against the
# rg 14.1.1 its system's official archive provides, verified by the SHA-256 written below
# (M5b plan, D16); then prints which tests did not run there and why (docs/platforms.md).
# The job `package` builds the release's packages on the same four systems with dist and checks
# them without publishing anything (M5b spec §8, plan Chunk 11).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: '8'
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  PCRE2_SYS_STATIC: '1'

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            rg_archive: ripgrep-14.1.1-x86_64-unknown-linux-musl.tar.gz
            rg_sha256: 4cf9f2741e6c465ffdb7c26f38056a59e2a2544b51f7cc128ef28337eeae4d8e
            prio: nice -n 19 ionice -c3
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            rg_archive: ripgrep-14.1.1-aarch64-apple-darwin.tar.gz
            rg_sha256: 24ad76777745fbff131c8fbc466742b011f925bfa4fffa2ded6def23b5b937be
            prio: nice -n 19
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            rg_archive: ripgrep-14.1.1-x86_64-apple-darwin.tar.gz
            rg_sha256: fc87e78f7cb3fea12d69072e7ef3b21509754717b746368fd40d88963630e2b3
            prio: nice -n 19
          - name: windows
            os: windows-2022
            target: x86_64-pc-windows-msvc
            rg_archive: ripgrep-14.1.1-x86_64-pc-windows-msvc.zip
            rg_sha256: d0f534024c42afd6cb4d38907c25cd2b249b79bbe6cc1dbee8e3e37c2b6e25a1
            prio: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    env:
      PRIO: ${{ matrix.prio }}
      SYSTEM: ${{ matrix.name }}
      # GNU time's report is parsed in English (tests/perf.rs).
      LC_ALL: ${{ matrix.name == 'linux' && 'C' || '' }}
    steps:
      - name: Low priority (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The runner's worker starts every later step; a process a BelowNormal one creates
          # is BelowNormal unless it asks otherwise, so cargo and the tests run below normal.
          (Get-Process -Id $PID).Parent.PriorityClass = 'BelowNormal'
          (Get-Process -Id $PID).Parent | Format-List Name, Id, PriorityClass

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.90.0'
          targets: ${{ matrix.target }}
          components: clippy, rustfmt

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # One cache per system: MSVC, GNU, arm64 and Intel objects are never shared.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: build-${{ matrix.name }}-${{ matrix.target }}-${{ runner.arch }}-rust1.90.0-${{ hashFiles('Cargo.lock') }}

      # The reference: rg 14.1.1's official archive for this system, checked before it is
      # opened. The tests themselves never download anything.
      - name: Reference ripgrep 14.1.1 (Unix)
        if: runner.os != 'Windows'
        env:
          ARCHIVE: ${{ matrix.rg_archive }}
          SHA256: ${{ matrix.rg_sha256 }}
        run: |
          dir="$RUNNER_TEMP/rg"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/$ARCHIVE" \
            "https://github.com/BurntSushi/ripgrep/releases/download/14.1.1/$ARCHIVE"
          if [ "$RUNNER_OS" = Linux ]; then
            echo "$SHA256  $dir/$ARCHIVE" | sha256sum -c -
          else
            echo "$SHA256  $dir/$ARCHIVE" | shasum -a 256 -c -
          fi
          tar -xzf "$dir/$ARCHIVE" -C "$dir"
          echo "SEARCHFOR_RG=$dir/${ARCHIVE%.tar.gz}/rg" >> "$GITHUB_ENV"
      - name: Reference ripgrep 14.1.1 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ARCHIVE: ${{ matrix.rg_archive }}
          SHA256: ${{ matrix.rg_sha256 }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'rg'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $zip = Join-Path $dir $env:ARCHIVE
          Invoke-WebRequest -Uri "https://github.com/BurntSushi/ripgrep/releases/download/14.1.1/$($env:ARCHIVE)" -OutFile $zip
          $got = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLowerInvariant()
          if ($got -ne $env:SHA256) { throw "SHA-256 of $($env:ARCHIVE) is $got, expected $($env:SHA256)" }
          Expand-Archive -Path $zip -DestinationPath $dir
          $rg = Join-Path $dir ($env:ARCHIVE -replace '\.zip$', '') | Join-Path -ChildPath 'rg.exe'
          "SEARCHFOR_RG=$rg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Check the reference
        run: |
          "$SEARCHFOR_RG" --version
          "$SEARCHFOR_RG" --version | head -1 | grep -Eq '^ripgrep 14\.1\.1( |$)'

      # The reference programs SEARCHFOR_REQUIRE_REFERENCE=1 requires, and the decompressors
      # of `-z`.
      - name: Reference tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qpdf poppler-utils time strace \
            bzip2 xz-utils lz4 zstd brotli
      - name: Reference tools (macOS)
        if: runner.os == 'macOS'
        run: brew install qpdf poppler lz4 zstd xz brotli
      - name: Reference tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # MSYS2's MinGW builds, named through their variables, never put on PATH: their DLLs
          # sit beside them, and the MSVC build must not see that toolchain.
          C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed mingw-w64-x86_64-qpdf mingw-w64-x86_64-poppler
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "SEARCHFOR_QPDF=C:\msys64\mingw64\bin\qpdf.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SEARCHFOR_PDFTOTEXT=C:\msys64\mingw64\bin\pdftotext.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Reference Python
        run: |
          python -c 'import sqlite3, sys; print(sys.version, sqlite3.sqlite_version)'
          echo "SEARCHFOR_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"

      # Every later cargo is --offline, as locally: the lock's crates are fetched here.
      - name: Fetch the locked crates
        run: cargo fetch --locked

      - name: Format (Linux)
        if: runner.os == 'Linux'
        run: $PRIO cargo fmt --all --check
      - name: Clippy
        run: $PRIO cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - name: Build release
        run: $PRIO cargo build --workspace --release --locked --offline
      - name: Full suite
        run: $PRIO cargo test --workspace --release --locked --offline
        env:
          SEARCHFOR_REQUIRE_REFERENCE: '1'
      - name: Short Processor fuzz (Linux)
        if: runner.os == 'Linux'
        run: $PRIO cargo test --release --locked --offline --test fuzz -- --nocapture
        env:
          SEARCHFOR_FUZZ_SECONDS: '120'
          SEARCHFOR_FUZZ_ARTIFACT_DIR: ${{ runner.temp }}/fuzz-artifacts
      - name: Short CLI fuzz (Linux)
        if: runner.os == 'Linux'
        run: $PRIO cargo test --release --locked --offline --test fuzz_m5 -- --nocapture
        env:
          SEARCHFOR_FUZZ_SECONDS: '120'
          SEARCHFOR_FUZZ_ARTIFACT_DIR: ${{ runner.temp }}/fuzz-artifacts
      # The ignored tests docs/platforms.md lists as selected explicitly in CI, one at a time:
      # memory ceilings and the refusal of bombs. Time ratios stay local: SEARCHFOR_PERF_TIMING
      # is not set (M5b plan, D18).
      - name: Memory and bomb checks (Linux)
        if: runner.os == 'Linux'
        run: |
          $PRIO cargo test --release --locked --offline --test perf -- --ignored --test-threads 1
          $PRIO cargo test --release --locked --offline -p searchfor-example-helper \
            -p searchfor-grammar -- --ignored --test-threads 1 memory_stays_flat
        env:
          SEARCHFOR_REQUIRE_REFERENCE: '1'

      - name: Tests that did not run on this system
        if: success() || failure()
        run: |
          set -euo pipefail
          # Each binary's list follows its "Running <file>" line; a test is "<name>: test".
          tests() {
            awk '/^ *Running /{bin=$2; gsub(/\\/, "/", bin)} /^ *Doc-tests /{bin="doc-tests"}
                 /: test$/{t=$0; sub(/: test$/, "", t); sub(/^ +/, "", t); print bin "\t" t}'
          }
          names() { awk -F'\t' '{n=$2; sub(/.*::/, "", n); print n}'; }
          $PRIO cargo test --workspace --release --locked --offline -- --list 2>&1 | tests > "$RUNNER_TEMP/listed.tsv"
          $PRIO cargo test --workspace --release --locked --offline -- --list --ignored 2>&1 | tests > "$RUNNER_TEMP/ignored.tsv"
          section() { awk -v h="$1" '$0 == h {f=1; next} /^## /{f=0} f' docs/platforms.md; }
          probes=$(section '## Entry points invoked by a parent test' | grep -o '`[a-z0-9_]*`' | tr -d '`' || true)
          probe_n=$(names < "$RUNNER_TEMP/ignored.tsv" | grep -Fxc -f <(printf '%s\n' "$probes") || true)
          selected_n=0
          if [ "$SYSTEM" = linux ]; then
            selected_n=$(awk -F'\t' '$1 == "tests/perf.rs" || $2 ~ /memory_stays_flat_over_five_thousand_requests$/' "$RUNNER_TEMP/ignored.tsv" | wc -l)
          fi
          total=$(wc -l < "$RUNNER_TEMP/listed.tsv")
          ignored=$(wc -l < "$RUNNER_TEMP/ignored.tsv")
          # The cfg table: a row naming this system must be absent from its list, any other
          # row present.
          section '## Tests excluded by `cfg`' | awk -F'|' -v sys="$SYSTEM" '/^\| `/ {
              name = $2; gsub(/[ `]/, "", name)
              print name "\t" ($4 ~ ("(^|[ ,])" sys "($|[ ,])"))
            }' > "$RUNNER_TEMP/rows.tsv"
          names < "$RUNNER_TEMP/listed.tsv" | sort -u > "$RUNNER_TEMP/names.txt"
          excluded=0; wrong=0
          while IFS=$'\t' read -r name skipped; do
            if grep -Fxq "$name" "$RUNNER_TEMP/names.txt"; then listed=1; else listed=0; fi
            if [ "$skipped" = 1 ]; then excluded=$((excluded + 1)); fi
            if [ "$skipped" = "$listed" ]; then
              echo "::error::docs/platforms.md: $name is $([ "$skipped" = 1 ] && echo 'listed as excluded on' || echo 'not listed as excluded on') $SYSTEM, and cargo test --list $([ "$listed" = 1 ] && echo 'has' || echo 'lacks') it"
              wrong=$((wrong + 1))
            fi
          done < "$RUNNER_TEMP/rows.tsv"
          line="$SYSTEM: $total tests listed; $ignored ignored ($probe_n invoked by a parent test, $selected_n selected explicitly in CI, $((ignored - probe_n - selected_n)) skipped); $excluded excluded by cfg (docs/platforms.md)"
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
          awk -F'\t' '{print "  ignored: " $1 " " $2}' "$RUNNER_TEMP/ignored.tsv"
          [ "$wrong" = 0 ]

      - name: Keep the failing fuzz cases
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-cases-ci-${{ github.sha }}
          path: ${{ runner.temp }}/fuzz-artifacts
          if-no-files-found: ignore

  # The release's packages (M5b spec §8 and §12 #39; plan Chunk 11), built by the dist the
  # release uses, for the target each runner releases natively. Nothing here publishes: no
  # token is available to the job, and it never runs `cargo publish` or `npm publish`.
  package:
    name: package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            prio: nice -n 19 ionice -c3
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            prio: nice -n 19
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            prio: nice -n 19
          - name: windows
            os: windows-2022
            target: x86_64-pc-windows-msvc
            prio: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      PRIO: ${{ matrix.prio }}
      SYSTEM: ${{ matrix.name }}
      TARGET: ${{ matrix.target }}
      DIST: dist
    steps:
      - name: Low priority (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: (Get-Process -Id $PID).Parent.PriorityClass = 'BelowNormal'

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.90.0'
          targets: ${{ matrix.target }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: package-${{ matrix.name }}-${{ matrix.target }}-${{ runner.arch }}-rust1.90.0-${{ hashFiles('Cargo.lock') }}

      # The generator the release uses, at the version dist-workspace.toml pins.
      - name: Install dist 0.33.0 (Unix)
        if: runner.os != 'Windows'
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.33.0/cargo-dist-installer.sh | sh
      - name: Install dist 0.33.0 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: irm https://github.com/axodotdev/cargo-dist/releases/download/v0.33.0/cargo-dist-installer.ps1 | iex
      - name: Check dist
        run: |
          "$DIST" --version
          [ "$("$DIST" --version)" = 'cargo-dist 0.33.0' ]
      # The static Linux archive links musl, and PCRE2 and the Grammars are C.
      - name: musl C toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
      - name: Fetch the locked crates
        run: cargo fetch --locked
      # The npm package's one dependency (its npm-shrinkwrap.json pins detect-libc 2.1.2),
      # cached here so that the install below takes it from the cache where it can.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cache the npm package's dependency
        run: npm cache add detect-libc@2.1.2

      # dist's plan: five targets, four installers, version 1.0.0, and only s4 (plan Task 11.1).
      - name: dist plan (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/dist-plan.json"
          "$DIST" plan --output-format=json > "$plan"
          python3 - "$plan" <<'PY'
          import json, sys
          p = json.load(open(sys.argv[1], encoding='utf-8'))
          strings = []
          def walk(x):
              if isinstance(x, dict):
                  for k, v in x.items():
                      strings.append(str(k)); walk(v)
              elif isinstance(x, list):
                  for v in x: walk(v)
              elif isinstance(x, str): strings.append(x)
          walk(p)
          text = '\n'.join(strings)
          for target in ['x86_64-unknown-linux-musl', 'aarch64-unknown-linux-musl',
                         'aarch64-apple-darwin', 'x86_64-apple-darwin', 'x86_64-pc-windows-msvc']:
              assert target in text, target
          # dist 0.33.0 names the formula's installer "Homebrew": compare without case.
          for installer in ['shell', 'powershell', 'homebrew', 'npm']:
              assert any(installer in s.lower() for s in strings), installer
          assert not any('searchfor-example-helper' in s for s in strings)
          assert not any('searchfor-grammar-' in s for s in strings)
          assert '1.0.0' in text
          # Stricter than the names: one app, and each archive holds s4 and the four documents.
          assert [r['app_name'] for r in p['releases']] == ['searchfor'], p['releases']
          installers = sorted(a['name'] for a in p['artifacts'].values() if a['kind'] == 'installer')
          assert installers == ['searchfor-installer.ps1', 'searchfor-installer.sh',
                                'searchfor-npm-package.tar.gz', 'searchfor.rb'], installers
          archives = [a for a in p['artifacts'].values() if a['kind'] == 'executable-zip']
          assert len(archives) == 5, [a['name'] for a in archives]
          for a in archives:
              names = sorted(x['path'] for x in a['assets'])
              exe = 's4.exe' if 'windows' in a['name'] else 's4'
              assert names == sorted(['LICENSE-APACHE', 'LICENSE-MIT', 'README.es.md', 'README.md', exe]), (a['name'], names)
          print('five targets, four installers, only s4: PASS')
          PY

      # release.yml is dist's output plus four patches (dist-workspace.toml): check that it still
      # is, and that regeneration kept the conditions publication depends on.
      # To regenerate it locally: run this step's script with RELEASE_WORKFLOW_WRITE=1.
      - name: Release workflow (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import difflib, json, os, re, subprocess, sys
          from pathlib import Path
          dist = os.environ.get('DIST', 'dist')
          wf, cfg = Path('.github/workflows/release.yml'), Path('dist-workspace.toml')
          committed = wf.read_text(encoding='utf-8')
          config = cfg.read_text(encoding='utf-8')
          allow = 'allow-dirty = ["ci"]\n'
          assert config.count(allow) == 1, 'dist-workspace.toml must keep allow-dirty = ["ci"]'
          try:
              cfg.write_text(config.replace(allow, ''), encoding='utf-8')
              subprocess.run([dist, 'generate', '--mode=ci'], check=True)
              generated = wf.read_text(encoding='utf-8')
          finally:
              cfg.write_text(config, encoding='utf-8')
              wf.write_text(committed, encoding='utf-8')
          # GitHub evaluates a dollar sign and two braces together, even in this script.
          ex = '$' '{{'
          # A release candidate tag (v1.0.0-rc.1) of version 1.0.0 is a pre-release of that
          # version: dist plans it only with --force-tag, which the stable tag goes without.
          force = "contains(github.ref_name, '-') && ' --force-tag' || ''"
          patches = [
              ("on:\n  pull_request:\n  push:\n    tags:\n      - '**[0-9]+.[0-9]+.[0-9]+*'\n",
               "# searchfor: only v<semver> tags release s4; grammars-v* tags belong to grammars.yml.\n"
               "on:\n  pull_request:\n  push:\n    tags:\n      - 'v[0-9]+.[0-9]+.[0-9]+*'\n"),
              ('name: Release\npermissions:\n  "contents": "write"\n',
               'name: Release\n# searchfor: read-only by default; the host job declares the write it needs.\n'
               'permissions:\n  "contents": "read"\n'),
              (f"      tag-flag: {ex} !github.event.pull_request && format('--tag={{0}}', github.ref_name) || '' }}}}\n",
               "      # searchfor: a release candidate of the Cargo version is planned with --force-tag.\n"
               f"      tag-flag: {ex} !github.event.pull_request && format('--tag={{0}}{{1}}', github.ref_name, {force}) || '' }}}}\n"),
              (f"dist {ex} (!github.event.pull_request && format('host --steps=create --tag={{0}}', github.ref_name)) || 'plan' }}}}",
               f"dist {ex} (!github.event.pull_request && format('host --steps=create --tag={{0}}{{1}}', github.ref_name, {force})) || 'plan' }}}}"),
          ]
          expected = generated
          for old, new in patches:
              n = expected.count(old)
              assert n == 1, f'dist generate writes {old!r} {n} times, not once: review the patches'
              expected = expected.replace(old, new)
          if os.environ.get('RELEASE_WORKFLOW_WRITE') == '1':
              wf.write_text(expected, encoding='utf-8')
              committed = expected
          elif committed != expected:
              sys.stdout.writelines(difflib.unified_diff(
                  expected.splitlines(True), committed.splitlines(True),
                  'dist generate + patches', 'release.yml'))
              sys.exit(f'release.yml is not what dist generate and the {len(patches)} patches write')
          # The conditions publication depends on, checked on the committed file.
          head, body = committed.split('\njobs:\n', 1)
          parts = re.split(r'(?m)^  ([A-Za-z0-9_-]+):\n', body)
          jobs = dict(zip(parts[1::2], parts[2::2]))
          assert re.findall(r"(?m)^      - '([^']*)'$", head) == ['v[0-9]+.[0-9]+.[0-9]+*'], 'tags'
          assert 'workflow_dispatch' not in committed, 'a manual dispatch could publish'
          assert re.search(r'(?m)^permissions:\n  "contents": "read"\n(?!  )', head), 'permissions'
          assert 'secrets.' not in head and 'cargo publish' not in committed
          # Every dist that takes the tag takes the pre-release's --force-tag with it.
          assert committed.count('--force-tag') == 3 and committed.count(force) == 2, 'force-tag'
          assert committed.count('needs.plan.outputs.tag-flag') == 3, 'tag-flag'
          for secret, owner in [('secrets.NPM_TOKEN', 'publish-npm'),
                                ('secrets.HOMEBREW_TAP_TOKEN', 'publish-homebrew-formula')]:
              assert [j for j, b in jobs.items() if secret in b] == [owner], secret
          for grant in ['"contents": "write"', '"id-token": "write"', '"attestations": "write"']:
              assert [j for j, b in jobs.items() if grant in b] == ['host'], grant
          # The dollar sign and the braces stay apart: GitHub evaluates them together, even here.
          guard = ('if: $' '{{ !fromJson(needs.plan.outputs.val).announcement_is_prerelease'
                   ' || fromJson(needs.plan.outputs.val).publish_prereleases }}')
          for j in ['publish-npm', 'publish-homebrew-formula']:
              assert guard in jobs[j] and '      - host\n' in jobs[j], j
          host = jobs['host']
          for built in ['build-local-artifacts', 'build-global-artifacts']:
              assert f"needs.{built}.result == 'success'" in host, built
          attest = host.index('uses: actions/attest@')
          assert 'subject-path: |\n            artifacts/*\n' in host[attest:]
          assert attest < host.index('gh release create'), 'attest before the release exists'
          # A release candidate publishes nothing to npm or Homebrew; the stable tag does. Each
          # is planned with the flags release.yml gives it.
          def plan(tag):
              flags = ['--force-tag'] if '-' in tag else []
              out = subprocess.run([dist, 'plan', '--output-format=json', f'--tag={tag}', *flags],
                                   check=True, capture_output=True, text=True).stdout
              return json.loads(out)
          rc, stable = plan('v1.0.0-rc.1'), plan('v1.0.0')
          assert rc['announcement_is_prerelease'] is True and rc['publish_prereleases'] is False
          assert stable['announcement_is_prerelease'] is False
          print(f'release.yml: dist generate + {len(patches)} patches; tags, secrets, permissions, guards: PASS')
          PY

      # The archive of this runner's target, the installers and the checksums (Task 11.1).
      - name: dist build
        run: |
          $PRIO "$DIST" build --artifacts=all --target="$TARGET" --output-format=json > "$RUNNER_TEMP/dist-build.json"
          ls -l target/distrib
      - name: Unpack the archive
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/archive"
          python3 - "target/distrib" "$TARGET" "$dir" <<'PY'
          import sys, tarfile, zipfile
          from pathlib import Path
          distrib, target, out = Path(sys.argv[1]), sys.argv[2], Path(sys.argv[3])
          windows = 'windows' in target
          archive = distrib / f"searchfor-{target}.{'zip' if windows else 'tar.xz'}"
          out.mkdir(parents=True)
          if windows:
              zipfile.ZipFile(archive).extractall(out)
          else:
              with tarfile.open(archive, 'r:xz') as t:
                  t.extractall(out, filter='tar')
          print(archive, '->', out)
          PY
          echo "ARTIFACT_DIR=$dir" >> "$GITHUB_ENV"
      # Run from the unpacked archive, never target/ or PATH (plan Task 11.3, Step 1).
      - name: Archive smoke
        working-directory: ${{ runner.temp }}
        run: |
          python3 - "$ARTIFACT_DIR" <<'PY'
          from pathlib import Path
          import os, subprocess, sys
          root = Path(sys.argv[1])
          files = [p for p in root.rglob('*') if p.is_file()]
          for name in ['LICENSE-MIT', 'LICENSE-APACHE', 'README.md', 'README.es.md']:
              assert any(p.name == name for p in files), name
          exes = [p for p in files if p.name in ('s4', 's4.exe')]
          assert len(exes) == 1
          v = subprocess.check_output([str(exes[0]), '--version'], text=True).strip()
          assert v == 's4 1.0.0', v
          assert not any('grammar' in p.name or 'example-helper' in p.name for p in files)
          print('native archive smoke: PASS')
          PY

      # The static Linux archive (Task 11.2, Step 4): no dynamic libc, and the unstripped s4
      # within 23,000,000 bytes (grill 8612). A missed cap fails; it is never raised here.
      - name: Static Linux s4 (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          s4=$(find "$ARTIFACT_DIR" -type f -name s4)
          file "$s4"
          readelf -d "$s4" || true
          if readelf -d "$s4" | grep -q NEEDED; then echo "::error::$s4 needs shared libraries"; exit 1; fi
          if readelf -l "$s4" | grep -q INTERP; then echo "::error::$s4 asks for a dynamic loader"; exit 1; fi
          size=$(stat -c %s "$s4")
          echo "unstripped x86_64-unknown-linux-musl s4: $size bytes (cap 23000000)" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$size" -le 23000000 ]

      # The musl s4's allocator against glibc's under s4's threads (M5b spec §8.1; plan Task
      # 11.2): the same release profile for both targets, built one after the other in this
      # target dir, and scripts/bench-m5b.sh --compare alternating 40 pairs of each s4 mode over
      # the M4 text corpus (20,000 files) on this runner. musl's own malloc measured 1.27 to
      # 1.29 x glibc (run of 0f4f1af), so the counter wraps jemalloc on musl (Step 3): the
      # musl s4 must link it and the glibc s4 must not, and this measures that binary (Step 4).
      # The report and its raw samples are kept.
      - name: musl against glibc (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          uptime
          for t in x86_64-unknown-linux-gnu x86_64-unknown-linux-musl; do
            $PRIO cargo build --release --locked --offline -p searchfor --bin s4 --target "$t"
            nm "target/$t/release/s4" > "$RUNNER_TEMP/symbols-$t.txt"
          done
          grep -q ' T _rjem_mallocx$' "$RUNNER_TEMP/symbols-x86_64-unknown-linux-musl.txt" ||
            { echo '::error::the musl s4 has no jemalloc behind its memory counter'; exit 1; }
          if grep -q ' _rjem_' "$RUNNER_TEMP/symbols-x86_64-unknown-linux-gnu.txt"; then
            echo '::error::the glibc s4 links jemalloc'; exit 1
          fi
          SEARCHFOR_BENCH_REPORT="$RUNNER_TEMP/musl-vs-glibc.json" $PRIO bash scripts/bench-m5b.sh \
            --compare target/x86_64-unknown-linux-gnu/release/s4 \
            target/x86_64-unknown-linux-musl/release/s4 "$RUNNER_TEMP/m4-corpus"
          uptime
      # The rule, in this order (plan Task 11.2): a musl/glibc ratio of the medians of at most
      # 1.05 passes; at least 1.15 called for jemalloc, which the musl s4 already has, so it
      # fails for Sebastián to decide (Step 4); in between it is his decision too, flagged as a
      # warning. The worst of the three s4 modes decides.
      - name: musl allocator decision (Linux)
        if: runner.os == 'Linux'
        run: |
          python3 - "$RUNNER_TEMP/musl-vs-glibc.json" <<'PY'
          import json, sys
          def decide(musl, glibc):
              ratio = musl / glibc
              if ratio <= 1.05:
                  return 'system'
              if ratio >= 1.15:
                  return 'jemalloc'
              return 'ask'
          assert decide(1.05, 1.0) == 'system'
          assert decide(1.0501, 1.0) == 'ask'
          assert decide(1.12, 1.0) == 'ask'
          assert decide(1.1499, 1.0) == 'ask'
          assert decide(1.15, 1.0) == 'jemalloc'
          print('musl allocator rule (<=1.05 system, >=1.15 jemalloc, else ask): PASS')
          report = json.load(open(sys.argv[1], encoding='utf-8'))
          rank = {'system': 0, 'ask': 1, 'jemalloc': 2}
          worst = 'system'
          for mode, m in report['modes'].items():
              glibc, musl = m['medians']['A']['wall'], m['medians']['B']['wall']
              d = decide(musl, glibc)
              worst = max(worst, d, key=rank.get)
              print(f"{mode}: glibc {glibc:.4f} s, musl {musl:.4f} s, musl/glibc {musl / glibc:.4f} -> {d}"
                    f" (uptime: {m['uptime']})")
              print(f"{mode} raw samples: {json.dumps(m['samples'])}")
          print(f'decision: {worst}')
          if worst == 'jemalloc':
              print('::error::musl with jemalloc behind the counter is still at least 1.15 x glibc: report the samples to Sebastián (plan Task 11.2, Step 4)')
              sys.exit(1)
          if worst == 'ask':
              print('::warning::musl with jemalloc is between 1.05 and 1.15 x glibc: Sebastián decides whether jemalloc stays (plan Task 11.2, Step 4)')
          else:
              print('jemalloc keeps musl within 1.05 x glibc: PASS')
          PY
      - name: Keep the musl measurement (Linux)
        if: runner.os == 'Linux' && (success() || failure())
        uses: actions/upload-artifact@v4
        with:
          name: musl-vs-glibc-${{ github.sha }}
          path: ${{ runner.temp }}/musl-vs-glibc.json
          if-no-files-found: ignore
      # The counter's contract under musl, with jemalloc behind it: the memory unit tests and
      # m4_22's warning.
      - name: Memory limits under musl (Linux)
        if: runner.os == 'Linux'
        run: |
          $PRIO cargo test --release --locked --offline --target x86_64-unknown-linux-musl --lib memory
          $PRIO cargo test --release --locked --offline --target x86_64-unknown-linux-musl --test cli_m4 m4_22

      # The checksums (spec §8.1): the archive's `.sha256` and `sha256.sum`, which lists every
      # archive and the npm package, verified with the system's own tool; then a copy of the
      # archive with one byte flipped must fail verification (plan Task 11.3, Step 3).
      - name: Checksums
        working-directory: target/distrib
        run: |
          set -euo pipefail
          if command -v sha256sum > /dev/null; then sum=(sha256sum); else sum=(shasum -a 256); fi
          archive="searchfor-$TARGET.tar.xz"
          [ -f "$archive" ] || archive="searchfor-$TARGET.zip"
          "${sum[@]}" -c "$archive.sha256"
          "${sum[@]}" -c sha256.sum
          for f in "$archive" searchfor-npm-package.tar.gz; do
            grep -Eq "^[0-9a-f]{64} \*$f\$" sha256.sum || { echo "::error::sha256.sum lacks $f"; exit 1; }
          done
          bad="$RUNNER_TEMP/corrupt-checksum"
          mkdir -p "$bad"
          cp "$archive" "$archive.sha256" "$bad/"
          python3 - "$bad/$archive" <<'PY'
          import sys
          from pathlib import Path
          p = Path(sys.argv[1]); b = bytearray(p.read_bytes()); b[len(b) // 2] ^= 0x01; p.write_bytes(bytes(b))
          PY
          if (cd "$bad" && "${sum[@]}" -c "$archive.sha256"); then
            echo "::error::a corrupt $archive passed its checksum"; exit 1
          fi
          echo 'checksums, and a flipped byte rejected: PASS'

      # The installers against this job's own archive, served on the loopback, with every other
      # destination unreachable (dead proxies), but for npm's registry, read only for the npm
      # package's dependency (npm --offline missed it in the cache on Windows): the shell
      # script (Unix), the npm package (every system; the .cmd shim on Windows) and the Homebrew
      # formula (macOS). Each must print s4 1.0.0, fetch exactly the archive, and fail on a
      # damaged archive (plan Task 11.3, Step 3). dist 0.33.0's shell script checks the SHA-256;
      # its npm package does not, so for npm the damage is in the archive's own integrity data.
      - name: Local installers
        run: |
          python3 - <<'PY'
          import http.server, json, os, shutil, subprocess, sys, tarfile, threading
          from pathlib import Path
          distrib = Path('target/distrib').resolve()
          target = os.environ['TARGET']
          tmp = Path(os.environ['RUNNER_TEMP']) / 'installers'
          windows, mac = os.name == 'nt', sys.platform == 'darwin'
          ext = 'zip' if 'windows' in target else 'tar.xz'
          archive = f'searchfor-{target}.{ext}'
          good, bad = tmp / 'good', tmp / 'bad'
          for d in (good, bad):
              d.mkdir(parents=True)
          shutil.copy(distrib / archive, good / archive)
          data = bytearray((distrib / archive).read_bytes())
          # The zip's end-of-central-directory signature; the xz stream's footer magic.
          data[len(data) - 22 if ext == 'zip' else len(data) - 1] ^= 0xff
          (bad / archive).write_bytes(bytes(data))

          requests = []
          class Handler(http.server.SimpleHTTPRequestHandler):
              def __init__(self, *a, **k):
                  super().__init__(*a, directory=str(tmp), **k)
              def do_GET(self):
                  requests.append(self.path)
                  super().do_GET()
              def log_message(self, *a):
                  pass
          server = http.server.ThreadingHTTPServer(('127.0.0.1', 0), Handler)
          threading.Thread(target=server.serve_forever, daemon=True).start()
          base = f'http://127.0.0.1:{server.server_port}'
          dead = 'http://127.0.0.1:9'
          env = dict(os.environ, HTTP_PROXY=dead, HTTPS_PROXY=dead, ALL_PROXY=dead, http_proxy=dead,
                     https_proxy=dead, all_proxy=dead, NO_PROXY='127.0.0.1', no_proxy='127.0.0.1',
                     HOMEBREW_NO_AUTO_UPDATE='1',
                     HOMEBREW_NO_ANALYTICS='1', HOMEBREW_NO_INSTALL_CLEANUP='1')

          def run(cmd, **k):
              print('+', ' '.join(map(str, cmd)), flush=True)
              return subprocess.run([str(c) for c in cmd], env=k.pop('env', env), **k)
          def version(exe):
              out = run([exe, '--version'], capture_output=True, text=True)
              assert out.returncode == 0, out
              return out.stdout.strip()
          def served(kind):
              got = list(requests); requests.clear()
              assert got == [f'/{kind}/{archive}'], got

          if not windows:
              for kind in ('good', 'bad'):
                  home = tmp / f'sh-{kind}'
                  r = run(['sh', distrib / 'searchfor-installer.sh', '--no-modify-path'],
                          env=dict(env, HOME=str(home), CARGO_HOME=str(home / '.cargo'),
                                   SEARCHFOR_DOWNLOAD_URL=f'{base}/{kind}'))
                  served(kind)
                  if kind == 'good':
                      assert r.returncode == 0, r
                      assert version(home / '.cargo' / 'bin' / 's4') == 's4 1.0.0'
                  else:
                      assert r.returncode != 0, 'the shell installer accepted a corrupt archive'
              print('shell installer: PASS')

          npm = shutil.which('npm')
          src = tmp / 'npm-package'
          with tarfile.open(distrib / 'searchfor-npm-package.tar.gz') as t:
              t.extractall(src, filter='data')
          [pkg] = [p.parent for p in src.rglob('package.json')]
          for kind in ('good', 'bad'):
              copy = tmp / f'npm-src-{kind}'
              shutil.copytree(pkg, copy)
              meta = json.loads((copy / 'package.json').read_text(encoding='utf-8'))
              meta['artifactDownloadUrls'] = [f'{base}/{kind}']
              (copy / 'package.json').write_text(json.dumps(meta, indent=2), encoding='utf-8')
              assert run([npm, 'pack', '--ignore-scripts'], cwd=copy).returncode == 0
              tgz = copy / 'searchfor-1.0.0.tgz'
              assert tgz.is_file(), list(copy.iterdir())
              prefix = tmp / f'npm-{kind}'
              registry = '127.0.0.1,registry.npmjs.org'
              r = run([npm, 'install', '--prefix', prefix, '--prefer-offline', '--no-audit',
                       '--no-fund', '--foreground-scripts', '--logs-dir', tmp / 'npm-logs', tgz],
                      env=dict(env, NO_PROXY=registry, no_proxy=registry))
              served(kind)
              shim = prefix / 'node_modules' / '.bin' / ('s4.cmd' if windows else 's4')
              if kind == 'good':
                  assert r.returncode == 0, r
                  assert version(shim) == 's4 1.0.0'
              else:
                  assert r.returncode != 0, 'npm installed a corrupt archive'
          print('npm package: PASS')

          if mac:
              # The generated formula stays as dist wrote it for the release; this copy, outside
              # the repository, points at the job's archive.
              formula = (distrib / 'searchfor.rb').read_text(encoding='utf-8')
              release = 'https://github.com/neitanod/searchfor/releases/download/v1.0.0/'
              assert release + archive in formula
              (tmp / 'searchfor.rb').write_text(formula.replace(release, f'file://{good}/'), encoding='utf-8')
              r = run(['brew', 'install', '--formula', './searchfor.rb'], cwd=tmp)
              if r.returncode != 0:
                  # Homebrew versions that install formulae only from a tap: a local one.
                  run(['brew', 'tap-new', '--no-git', 'searchfor/smoke'], check=True)
                  tap = run(['brew', '--repository', 'searchfor/smoke'], check=True,
                            capture_output=True, text=True).stdout.strip()
                  shutil.copy(tmp / 'searchfor.rb', Path(tap) / 'Formula' / 'searchfor.rb')
                  run(['brew', 'install', '--formula', 'searchfor/smoke/searchfor'], check=True)
              brew = run(['brew', '--prefix'], check=True, capture_output=True, text=True).stdout.strip()
              assert version(Path(brew) / 'bin' / 's4') == 's4 1.0.0'
              run(['brew', 'uninstall', '--formula', 'searchfor'], check=True)
              print('Homebrew formula: PASS')
          server.shutdown()
          PY

      # The crate (spec §8.4): the package, verified offline from the crates fetched above, and a
      # publish rehearsal that uploads nothing. The rehearsal cannot run --offline: cargo 1.90
      # discards its cached crates.io index configuration on every publish and reads it again,
      # so it reads (never writes) crates.io; it skips the verification the package step did.
      # This job never runs `cargo publish` itself.
      - name: Crate (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          $PRIO cargo package --list --locked --offline --allow-dirty -p searchfor | tee "$RUNNER_TEMP/crate-files.txt"
          for f in Cargo.toml LICENSE-MIT LICENSE-APACHE README.md README.es.md grammars/index.json \
                   formats/markdown.toml src/main.rs src/rg_types.txt; do
            grep -Fxq "$f" "$RUNNER_TEMP/crate-files.txt" || { echo "::error::the crate lacks $f"; exit 1; }
          done
          if grep -q '^tests/' "$RUNNER_TEMP/crate-files.txt"; then echo "::error::the crate carries tests/"; exit 1; fi
          $PRIO cargo package --locked --offline --allow-dirty -p searchfor
          $PRIO cargo publish --dry-run --locked --allow-dirty --no-verify -p searchfor
          ls -l target/package/searchfor-1.0.0.crate
