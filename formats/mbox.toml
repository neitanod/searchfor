# formats/mbox.toml — mbox mailboxes (M6 spec §10.1): `Re: the needle budget › part 1 text/plain`.
# The `From ` magic applies, as every magic, only to names without an extension
# (Thunderbird's `Inbox`, `Sent`).
name       = "mbox"
names      = ["mbox"]
extensions = ["mbox", "mbx"]
magic      = [{ hex = "46726f6d20" }]
processor  = "mail"

[params]
syntax     = "mbox"
# Characters of a message's, a header's or a part's name before it is cut with `…`.
name_chars = 40
