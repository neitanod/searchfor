# formats/nginx.toml — nginx blocks and directives (M6 spec §7.6):
# `http › server example.com › location /api › proxy_pass`.
name       = "nginx"
names      = ["nginx.conf"]
# The Detector reads `paths` from Chunk 1 (M6 plan, Task 1.1); until both are merged this
# line stays a comment, as a key the Definition does not know yet fails the built-in.
paths      = ["**/nginx/**/*.conf", "**/nginx/sites-available/*", "**/nginx/sites-enabled/*"]
processor  = "blocks"

[params]
syntax = "nginx"
# Characters of a block's name (its directive and arguments) before it is cut with `…`.
name_chars = 40
