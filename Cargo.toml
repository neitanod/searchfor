[package]
name = "searchfor"
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.90"
description = "ripgrep-compatible search that shows where each match lives: headings, functions, key paths"
license = "MIT OR Apache-2.0"
repository = "https://github.com/neitanod/searchfor"
readme = "README.md"
keywords = ["grep", "search", "markdown", "ripgrep", "cli"]
categories = ["command-line-utilities", "text-processing"]

[[bin]]
name = "s4"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive", "string", "wrap_help"] }
dirs = "6"
# The `=` versions are ripgrep 14.1.1's: later grep-searcher and grep-printer change
# bytes_searched and -m, and later regex crates the Unicode tables. Keep them on a cargo update.
encoding_rs = "=0.8.34"
globset = "=0.4.15"
grep-cli = "=0.1.11"
grep-matcher = "=0.1.7"
grep-printer = "=0.2.2"
grep-regex = "=0.1.13"
grep-searcher = "=0.1.14"
ignore = "=0.4.23"
memchr = "=2.7.4"
memmap2 = "0.9"
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
termcolor = "1.4"
terminal_size = "0.4"
thiserror = "2"
toml = "1.1"
# Not used directly: pinned to ripgrep 14.1.1's Cargo.lock so that a resolution without our
# lock (`cargo install searchfor`) matches, decodes and walks as rg 14.1.1. regex-syntax and
# regex-automata carry the Unicode tables (rg's Unicode 15) behind \w, \d, \b, -w and -i.
aho-corasick = { version = "=1.1.3", default-features = false }
bstr = { version = "=1.10.0", default-features = false }
encoding_rs_io = "=0.1.7"
regex-automata = { version = "=0.4.7", default-features = false }
regex-syntax = { version = "=0.8.4", default-features = false }
# Code Grammars compiled in (ADR 0005). tree-sitter 0.24.7 is the newest whose `regex`
# requirement (^1.10.6, regex-syntax ^0.8.4) accepts the ripgrep 14.1.1 pins above; 0.25+
# would move regex-automata and regex-syntax, and with them rg's Unicode tables (M2 plan, D1).
# It loads ABI 14 Grammars, hence these Grammar versions. Keep the `=`: a cargo update must
# not move them, and `cargo install searchfor` resolves without our lock.
tree-sitter = "=0.24.7"
streaming-iterator = "0.1"
tree-sitter-bash = "=0.23.3"
tree-sitter-go = "=0.23.4"
tree-sitter-javascript = "=0.23.1"
tree-sitter-php = "=0.23.11"
tree-sitter-python = "=0.23.6"
tree-sitter-rust = "=0.23.3"
tree-sitter-typescript = "=0.23.2"
# keypath (spec §4.3): spans for TOML, events with markers for YAML.
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }
saphyr-parser = "0.2"
# --install-grammar (spec §7).
sha2 = "0.11"
ureq = "3"
# Temporary files for Helper Processors (spec §4.4, Paths).
tempfile = "3"
# CSV and TSV fields with their byte offsets (spec §5.5; M3 plan, D3).
csv-core = "0.1"
# Object files, ELF, PE and Mach-O, and Rust symbol names (spec §5.7; M4 plan, D3).
goblin = { version = "0.10", default-features = false, features = ["std", "elf32", "elf64", "mach32", "mach64", "pe32", "pe64", "te", "endian_fd"] }
rustc-demangle = "0.1"
# Documents (spec §5.8; M4 plan, D12, D13): the zip of Office, OpenDocument and EPUB files, and
# PDF's objects, fonts, streams and encryption. Their XML and SQLite are read by our own code.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
lopdf = { version = "0.45", default-features = false }

# Ctrl-C with Helper Processors running (spec §4.4, Lifetime; M2 plan, D42).
[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"
# The limits of the child that extracts a document (M4 plan, D30): setrlimit and kill.
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
insta = { version = "1", features = ["json"] }
jsonschema = { version = "0.21", default-features = false }
regex-lite = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1

[workspace]
members = ["helpers/example", "helpers/grammar"]
