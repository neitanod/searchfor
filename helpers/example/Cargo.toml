[package]
name = "searchfor-example-helper"
version = "0.2.0-dev"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
publish = false
description = "Example Helper Processor for searchfor: INI sections and keys, over protocol v1"

# Only s4 goes into the release archives (M5b spec §8.1).
[package.metadata.dist]
dist = false

[dependencies]
anyhow = "1"
searchfor = { path = "../.." }

[dev-dependencies]
serde_json = "1"

# `--test-console-driver` (M5b plan, Task 2.3): a private console and its Ctrl-C.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"] }
