[package]
name = "searchfor-grammar"
version = "0.2.0-dev"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
publish = false
description = "Grammar Helper template for searchfor: one tree-sitter Grammar per build"

# One Grammar per build: `--no-default-features --features <lang>`; zero or two is a
# compile_error (M5b plan, D17). Lua is the default, for the workspace's own tests.
[features]
default = ["lua"]
lua = ["dep:tree-sitter-lua"]
c = ["dep:tree-sitter-c"]
cpp = ["dep:tree-sitter-cpp"]
java = ["dep:tree-sitter-java"]
ruby = ["dep:tree-sitter-ruby"]
c-sharp = ["dep:tree-sitter-c-sharp"]
elixir = ["dep:tree-sitter-elixir"]

# Only s4 goes into the release archives (M5b spec §8.1).
[package.metadata.dist]
dist = false

[dependencies]
anyhow = "1"
searchfor = { path = "../.." }
tree-sitter = "=0.24.7"
tree-sitter-lua = { version = "=0.2.0", optional = true }
# The six Grammars of v1.0 (Q57.gramaticas), each at its last ABI-14 release, which the
# `=0.24.7` runtime loads (M5b plan, D-ABI): C 0.24.2 and C# 0.23.5 are ABI 15.
tree-sitter-c = { version = "=0.23.4", optional = true }
tree-sitter-cpp = { version = "=0.23.4", optional = true }
tree-sitter-java = { version = "=0.23.5", optional = true }
tree-sitter-ruby = { version = "=0.23.1", optional = true }
tree-sitter-c-sharp = { version = "=0.23.1", optional = true }
tree-sitter-elixir = { version = "=0.3.5", optional = true }

[dev-dependencies]
jsonschema = { version = "0.21", default-features = false }
serde_json = "1"
